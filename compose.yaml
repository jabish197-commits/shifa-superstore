services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shifa
      POSTGRES_USER: shifa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifa -d shifa"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DB_HOST: db
      DB_NAME: shifa
      DB_USER: shifa
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
volumes:
  postgres_data:
  media:
  static:
